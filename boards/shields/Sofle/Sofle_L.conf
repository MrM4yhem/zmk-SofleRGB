# BLE connection interval to host (master-side only — irrelevant on the peripheral)
# 6 = 7.5ms, the fastest interval BLE allows. LATENCY=0 stops the host/keyboard
# from silently skipping connection events, which is what usually reads as
# random input stutter rather than a flat, predictable delay.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ZMK Studio configuration
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

CONFIG_ZMK_POINTING=y

# RGB configuration
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n


# OLED configuration

# Sleep related configuration
# Milliseconds of inactivity before entering idle state	(5 minutes for right side)
CONFIG_ZMK_IDLE_TIMEOUT=300000

